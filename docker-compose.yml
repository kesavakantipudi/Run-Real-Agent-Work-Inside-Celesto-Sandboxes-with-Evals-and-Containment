services:
  ledger:
    image: postgres:16-alpine
    container_name: sandboxshield-ledger
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    volumes:
      - ./seeds:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sandboxshield-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://ledger:ledger@ledger:5432/ledger
      API_PORT: "8080"
      CELESTO_PROVIDER: cloud
      CELESTO_API_KEY: placeholder
      LLM_API_KEY: placeholder
      LLM_MODEL: gpt-4o-mini
    depends_on:
      ledger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
